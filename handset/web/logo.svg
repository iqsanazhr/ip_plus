<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Apple Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="50%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Titanium Body Gradient -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Plus Badge Gradient -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#0051ba"/>
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- App Icon Base: Apple Squircle (512x512) -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>

  <!-- Phone Body (Centered slightly left) -->
  <g filter="url(#phoneShadow)">
    <!-- Titanium Outer Bezel -->
    <rect x="135" y="56" width="220" height="400" rx="46" fill="url(#titaniumGrad)"/>
    <!-- Phone Screen OLED Pitch Black -->
    <rect x="142" y="63" width="206" height="386" rx="40" fill="#000000"/>
    
    <!-- Screen Inner Specular Glass Arc -->
    <path d="M142 103 Q 245 130 348 103 L 348 63 Q 245 63 142 63 Z" fill="rgba(255,255,255,0.06)"/>

    <!-- Dynamic Island -->
    <rect x="206" y="78" width="78" height="22" rx="11" fill="#000000" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- TrueDepth & Camera Punch Holes -->
    <circle cx="225" cy="89" r="4.5" fill="#08090f"/>
    <circle cx="265" cy="89" r="5" fill="#121826"/>
    <circle cx="266" cy="88" r="1.8" fill="rgba(255,255,255,0.55)"/>

    <!-- iOS Home Bar Indicator -->
    <rect x="211" y="432" width="68" height="4.5" rx="2.25" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Plus Accent Badge (+) Apple Style at Bottom Right -->
  <g filter="url(#badgeShadow)">
    <circle cx="380" cy="380" r="66" fill="url(#plusGrad)" stroke="#ffffff" stroke-width="4.5"/>
    <!-- Bold Plus Sign -->
    <rect x="373" y="344" width="14" height="72" rx="7" fill="#ffffff"/>
    <rect x="344" y="373" width="72" height="14" rx="7" fill="#ffffff"/>
  </g>
</svg>